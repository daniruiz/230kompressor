<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 720 500"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">From original to prepared tune</title>
  <desc
    id="desc"
  >Keep an unchanged backup of original.bin. Prepare a tuned.bin copy and check that it matches the ECU and has a valid checksum before writing it.</desc>
  <defs>
    <linearGradient id="metal" x2="1" y2="1"><stop stop-color="#eff1f4" /><stop
        offset="1"
        stop-color="#dce0e5"
      /></linearGradient>
    <marker
      id="arrow"
      viewBox="0 0 10 10"
      refX="8"
      refY="5"
      markerWidth="7"
      markerHeight="7"
      orient="auto-start-reverse"
    ><path
        d="M1 1 9 5 1 9"
        fill="none"
        stroke="#b8174c"
        stroke-width="2"
        stroke-linejoin="round"
      /></marker>
    <style
    >text { font-family: Arial, sans-serif; fill: #303641; } .muted { fill: #485361; } .accent { fill: #b8174c; } .panel { fill: #eff1f4; stroke: #b8c0cb; stroke-width: 2; } .route { fill: none; stroke: #b8174c; stroke-width: 3; marker-end: url(#arrow); } .icon { fill: none; stroke: #485361; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }</style>
  </defs>
  <rect width="720" height="500" rx="24" fill="url(#metal)" />
  <text
    x="36"
    y="49"
    font-size="32"
    font-weight="700"
  >From original to prepared tune</text>
  <rect class="panel" x="30" y="96" width="290" height="142" rx="18" />
  <rect class="panel" x="400" y="96" width="290" height="142" rx="18" />
  <rect class="panel" x="30" y="319" width="290" height="113" rx="18" />
  <rect class="panel" x="400" y="319" width="290" height="113" rx="18" />
  <text
    x="175"
    y="143"
    text-anchor="middle"
    font-size="32"
    font-weight="700"
  >original.bin</text>
  <text
    x="175"
    y="184"
    text-anchor="middle"
    font-size="25"
    class="muted"
  >Read from your ECU</text>
  <text
    x="175"
    y="216"
    text-anchor="middle"
    font-size="25"
    class="muted"
  >Keep unchanged</text>
  <path class="route" d="M331 169h56" />
  <text
    x="360"
    y="146"
    text-anchor="middle"
    font-size="23"
    class="muted"
  >Copy</text>
  <text
    x="545"
    y="143"
    text-anchor="middle"
    font-size="32"
    font-weight="700"
    class="accent"
  >tuned.bin</text>
  <text
    x="545"
    y="184"
    text-anchor="middle"
    font-size="25"
    class="muted"
  >Check target ECU</text>
  <text
    x="545"
    y="216"
    text-anchor="middle"
    font-size="25"
    class="muted"
  >and checksum</text>
  <path class="route" d="M175 247v59" />
  <path class="route" d="M545 247v59" />
  <text x="570" y="285" font-size="24" class="muted">Write</text>
  <text
    x="175"
    y="367"
    text-anchor="middle"
    font-size="27"
    font-weight="700"
  >Backup copy</text>
  <text
    x="175"
    y="404"
    text-anchor="middle"
    font-size="24"
    class="muted"
  >Store separately</text>
  <text
    x="545"
    y="367"
    text-anchor="middle"
    font-size="29"
    font-weight="700"
  >ECU ME2.1</text>
  <text
    x="545"
    y="404"
    text-anchor="middle"
    font-size="24"
    class="muted"
  >Verify the result</text>
  <text
    x="360"
    y="474"
    text-anchor="middle"
    font-size="26"
    class="muted"
  >Always keep the original file from your car</text>
</svg>
