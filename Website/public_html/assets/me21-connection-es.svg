<title id="title">Puerto Mercedes de 38 pines: 3 / 5</title><desc
    id="desc"
  >Vista frontal del conector X11/4 del coche, con la guía central en U abierta hacia arriba. El pin 3 es el de la derecha de la fila superior; el pin 5, el segundo desde la izquierda en la segunda fila. Ambos están resaltados y unidos por el puente de escritura.</desc>
