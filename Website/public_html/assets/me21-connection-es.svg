<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 720 330"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Puerto Mercedes de 38 pines: puente para escritura</title>
  <desc
    id="desc"
  >Esquema conceptual del puente entre los terminales numerados 3 y 5. No representa la posición física ni la orientación del conector de 38 pines.</desc>
  <defs>
    <linearGradient id="metal" x2="1" y2="1">
      <stop stop-color="#eff1f4" />
      <stop offset="1" stop-color="#dce0e5" />
    </linearGradient>
  </defs>
  <rect width="720" height="330" rx="24" fill="url(#metal)" />
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text
      x="360"
      y="44"
      font-size="34"
      font-weight="700"
      fill="#303641"
    >Puerto Mercedes de 38 pines</text>
    <text
      x="360"
      y="86"
      font-size="32"
      fill="#485361"
    >Puente para escritura</text>
    <path
      d="M300 158H420"
      stroke="#b8174c"
      stroke-width="8"
      stroke-linecap="round"
    />
    <circle
      cx="260"
      cy="158"
      r="40"
      fill="#eff1f4"
      stroke="#b8174c"
      stroke-width="4"
    />
    <circle
      cx="460"
      cy="158"
      r="40"
      fill="#eff1f4"
      stroke="#b8174c"
      stroke-width="4"
    />
    <text
      x="260"
      y="173"
      font-size="44"
      font-weight="700"
      fill="#303641"
    >3</text>
    <text
      x="460"
      y="173"
      font-size="44"
      font-weight="700"
      fill="#303641"
    >5</text>
    <text
      x="360"
      y="258"
      font-size="32"
      fill="#485361"
    >Diagrama del puente; verifica los</text>
    <text
      x="360"
      y="298"
      font-size="32"
      fill="#485361"
    >números del conector</text>
  </g>
</svg>
